apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: redirect-to-proxy-cache
  annotations:
    policies.kyverno.io/title: Redirect Docker Hub to Local Proxy Cache
spec:
  background: false
  rules:
    - name: mutate-standard-containers
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - docker-registry
      mutate:
        foreach:
          - list: "request.object.spec.containers"
            patchStrategicMerge:
              spec:
                containers:
                  - name: "{{ element.name }}"
                    image: "{{ regex_replace_all('^docker.io/', element.image, 'https://registry.unixworld.io') }}"
    - name: mutate-init-containers
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - docker-registry
      preconditions:
        all:
        - key: "{{ request.object.spec.initContainers || '' }}"
          operator: NotEquals
          value: ""
      mutate:
        foreach:
          - list: "request.object.spec.initContainers"
            patchStrategicMerge:
              spec:
                initContainers:
                  - name: "{{ element.name }}"
                    image: "{{ regex_replace_all('^docker.io/', element.image, 'https://registry.unixworld.io') }}"
