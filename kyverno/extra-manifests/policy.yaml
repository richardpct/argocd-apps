apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: redirect-to-proxy-cache
  annotations:
    policies.kyverno.io/title: Redirect Docker Hub to Local Proxy Cache
spec:
  background: false
  rules:
    - name: mutate-all-images
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - docker-registry
      mutate:
        foreach:
          - list: "request.object.spec.containers"
            patchStrategicMerge:
              spec:
                containers:
                  - (name): "{{ element.name }}"
                    image: "{{ regex_replace_all('^docker.io/([^/]+)$', element.image, 'registry.unixworld.io/library/${1}') | regex_replace_all('^docker.io/', @, 'registry.unixworld.io/') | regex_replace_all('^([^/]+)$', @, 'registry.unixworld.io/library/${1}') | regex_replace_all('^([^/.]+/[^/]+)$', @, 'registry.unixworld.io/${1}') }}"
          - list: "request.object.spec.initContainers || `[]`"
            patchStrategicMerge:
              spec:
                initContainers:
                  - (name): "{{ element.name }}"
                    image: "{{ regex_replace_all('^docker.io/([^/]+)$', element.image, 'registry.unixworld.io/library/${1}') | regex_replace_all('^docker.io/', @, 'registry.unixworld.io/') | regex_replace_all('^([^/]+)$', @, 'registry.unixworld.io/library/${1}') | regex_replace_all('^([^/.]+/[^/]+)$', @, 'registry.unixworld.io/${1}') }}"
