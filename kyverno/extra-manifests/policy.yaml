apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: redirect-dockerhub-to-private-registry
  annotations:
    policies.kyverno.io/title: Redirect Docker Hub to Private Registry
    policies.kyverno.io/category: Image Management
spec:
  background: false
  rules:
    # Rule 1: docker.io/<image> (no namespace) -> registry.unixworld.io/library/<image>
    - name: rewrite-dockerhub-library
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
                - docker-registry
      mutate:
        foreach:
          - list: "request.object.spec.initContainers"
            preconditions:
              all:
                - key: "{{ element.image }}"
                  operator: Equals
                  value: "{{ regex_match('^(docker\\.io|index\\.docker\\.io)/[^/]+(:[^/]+)?$', '{{element.image}}') }}"
            patchStrategicMerge:
              spec:
                initContainers:
                  - name: "{{ element.name }}"
                    image: "{{ regex_replace_all('^(docker\\.io|index\\.docker\\.io)/', '{{element.image}}', 'registry.unixworld.io/library/') }}"
          - list: "request.object.spec.containers"
            preconditions:
              all:
                - key: "{{ element.image }}"
                  operator: Equals
                  value: "{{ regex_match('^(docker\\.io|index\\.docker\\.io)/[^/]+(:[^/]+)?$', '{{element.image}}') }}"
            patchStrategicMerge:
              spec:
                containers:
                  - name: "{{ element.name }}"
                    image: "{{ regex_replace_all('^(docker\\.io|index\\.docker\\.io)/', '{{element.image}}', 'registry.unixworld.io/library/') }}"

    # Rule 2: docker.io/<namespace>/<image> -> registry.unixworld.io/<namespace>/<image>
    - name: rewrite-dockerhub-namespaced
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
                - docker-registry
      mutate:
        foreach:
          - list: "request.object.spec.initContainers"
            preconditions:
              all:
                - key: "{{ regex_match('^(docker\\.io|index\\.docker\\.io)/[^/]+/[^/]+', '{{element.image}}') }}"
                  operator: Equals
                  value: true
            patchStrategicMerge:
              spec:
                initContainers:
                  - name: "{{ element.name }}"
                    image: "{{ regex_replace_all('^(docker\\.io|index\\.docker\\.io)/', '{{element.image}}', 'registry.unixworld.io/') }}"
          - list: "request.object.spec.containers"
            preconditions:
              all:
                - key: "{{ regex_match('^(docker\\.io|index\\.docker\\.io)/[^/]+/[^/]+', '{{element.image}}') }}"
                  operator: Equals
                  value: true
            patchStrategicMerge:
              spec:
                containers:
                  - name: "{{ element.name }}"
                    image: "{{ regex_replace_all('^(docker\\.io|index\\.docker\\.io)/', '{{element.image}}', 'registry.unixworld.io/') }}"
