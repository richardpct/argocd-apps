---
authentik:
  existingSecret:
    secretName: "authentik-secret"
  # This sends anonymous usage-data, stack traces on errors and
  # performance data to sentry.io, and is fully opt-in
  error_reporting:
    enabled: true
  postgresql:
    password: "2V/Z2Qfrn2Mx87cL006wDd50AFEdbCEhV"

blueprints:
  configMaps:
    - authentik-custom-blueprints

server:
  route:
    main:
      enabled: true
      hostnames:
        - authentik.unixworld.io
      parentRefs:
        - name: tls-gateway
          namespace: kube-system
      matches:
        - path:
            type: PathPrefix
            value: /

postgresql:
  enabled: true
  auth:
    password: "2V/Z2Qfrn2Mx87cL006wDd50AFEdbCEhV"

additionalObjects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: authentik-custom-blueprints
    data:
      grafana-blueprint.yaml: |
        version: 1
        metadata:
          name: "Grafana"
        entries:
          - model: authentik_core.user
            state: present
            identifiers:
              username: "rpct"
            attrs:
              name: "rpct"
              email: "rpct@unixworld.io"
              is_active: true
              path: "users"
              type: "internal"
              password: !Env [RPCT_PASSWORD, "tototata"]
          - model: authentik_providers_oauth2.oauth2provider
            state: present
            identifiers:
              name: "Provider for grafana"
            attrs:
              client_id: "6gaswM7ilnnoiWPuihRR3poiboJw8ii2wSmfrbHO"
              client_secret: !Env [GRAFANA_CLIENT_SECRET, "tititutu"]
              client_type: "confidential"
              grant_types:
                - "authorization_code"
                - "refresh_token"
              include_claims_in_id_token: true
              issuer_mode: "per_provider"
              sub_mode: "hashed_user_id"
              logout_method: "backchannel"
              logout_uri: "https://grafana.unixworld.io/logout"
              authorization_flow: !Find [authentik_flows.flow, [slug, "default-provider-authorization-implicit-consent"]]
              invalidation_flow: !Find [authentik_flows.flow, [slug, "default-provider-invalidation-flow"]]
              signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
              redirect_uris:
                - matching_mode: "strict"
                  redirect_uri_type: "authorization"
                  url: "https://grafana.unixworld.io/login/generic_oauth"
              property_mappings:
                - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "openid"]]
                - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "email"]]
                - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "profile"]]
                - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "entitlements"]]
          - model: authentik_core.application
            state: present
            identifiers:
              slug: "grafana"
            attrs:
              name: "grafana"
              open_in_new_tab: false
              policy_engine_mode: "any"
              provider: !Find [authentik_providers_oauth2.oauth2provider, [name, "Provider for grafana"]]
          - model: authentik_core.applicationentitlement
            state: present
            identifiers:
              name: "Grafana Admins"
              app: !Find [authentik_core.application, [slug, "grafana"]]
            attrs:
              name: "Grafana Admins"
          - model: authentik_core.applicationentitlement
            state: present
            identifiers:
              name: "Grafana Editors"
              app: !Find [authentik_core.application, [slug, "grafana"]]
            attrs:
              name: "Grafana Editors"
          - model: authentik_policies.policybinding
            state: present
            identifiers:
              target: !Find [authentik_core.applicationentitlement, [name, "Grafana Admins"], [app, !Find [authentik_core.application, [slug, "grafana"]]]]
              user: !Find [authentik_core.user, [username, "rpct"]]
            attrs:
              order: 0
