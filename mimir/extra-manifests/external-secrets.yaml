apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: mimir
spec:
  provider:
    vault:
      server: "http://vault.vault:8200"
      path: "mimir"
      version: "v2"
      auth:
        tokenSecretRef:
          name: "vault-token"
          key: "token"
          namespace: mimir
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mimir-secret
  namespace: mimir
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: mimir-secret
  data:
  - secretKey: foo
    remoteRef:
      key: secret
      property: foo
  - secretKey: zip
    remoteRef:
      key: secret
      property: zip
