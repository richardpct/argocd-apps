apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-mimir
  namespace: mimir
spec:
  parentRefs:
  - name: tls-gateway
    namespace: kube-system
  hostnames:
  - mimir.unixworld.io
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: mimir-gateway
      port: 80
