apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-backend
  namespace: ceph-csi
spec:
  provider:
    vault:
      server: "http://openbao.openbao:8200"
      path: "ceph-csi"
      version: "v2"
      auth:
        tokenSecretRef:
          name: "openbao-token"
          key: "token"
          namespace: ceph-csi
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: csi-cephfs-secret
  namespace: ceph-csi
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: openbao-backend
    kind: SecretStore
  target:
    name: csi-cephfs-secret
  data:
  - secretKey: userID
    remoteRef:
      key: secret
      property: userID
  - secretKey: userKey
    remoteRef:
      key: secret
      property: userKey
